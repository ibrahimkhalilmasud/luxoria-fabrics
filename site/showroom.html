<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showroom — Luxoria</title>
  <meta name="description" content="Scroll through every Luxoria fabric full screen and add favourites to your cart in one tap.">
  <meta name="theme-color" content="#0b0b0c">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0b0c'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%23c9a96e'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui.css">
</head>
<body class="page-showroom">
  <div class="grain" aria-hidden="true"></div>
  <header class="nav" id="nav">
    <a class="nav__brand" href="index.html" aria-label="Luxoria home">
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M20 3 L23 13 L33 9 L28 18 L37 20 L28 22 L33 31 L23 27 L20 37 L17 27 L7 31 L12 22 L3 20 L12 18 L7 9 L17 13 Z" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="20" cy="20" r="3.2" fill="currentColor"/></svg>
      </span>
      <span class="nav__word">LUXORIA</span>
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="index.html#collection">Collection</a>
      <a href="lookbook.html">Lookbook</a>
      <a href="showroom.html" aria-current="page">Showroom</a>
      <a href="index.html#acquire">How to Acquire</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="nav__actions">
      <a class="nav__icon-link" href="showroom.html" aria-label="Showroom"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="6" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="14" y="3" width="6" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>Showroom</span></a>
      <a class="cart-link" id="cartLink" href="cart.html" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span class="cart-link__label">Cart</span>
        <span class="badge" id="cartCount" hidden>0</span>
      </a>
    </div>
  </header>

  <main class="showroom">
    <div class="feed-tools" id="feedTools">
      <div class="feed-tools__title">
        <h1>Showroom</h1>
        <p id="feedCount" aria-live="polite"></p>
      </div>
      <div class="chips" id="feedCats" hidden></div>
      <div class="seg" role="group" aria-label="Scroll direction">
        <button data-dir="vertical" aria-pressed="false" aria-label="Scroll top to bottom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M7 15l5 5 5-5M7 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>Vertical</span>
        </button>
        <button data-dir="horizontal" aria-pressed="false" aria-label="Scroll left to right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M9 7l-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>Horizontal</span>
        </button>
      </div>
      <div class="feed-progress" aria-hidden="true"><span id="feedProgress"></span></div>
    </div>
    <div class="feed" id="feed" tabindex="0" aria-label="Fabric gallery"></div>
    <button class="feed-nav feed-nav--prev" id="feedPrev" aria-label="Previous fabric">&lsaquo;</button>
    <button class="feed-nav feed-nav--next" id="feedNext" aria-label="Next fabric">&rsaquo;</button>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/showroom.js"></script>
</body>
</html>
